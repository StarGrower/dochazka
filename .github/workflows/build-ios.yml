# Sestaví NEPODEPSANÉ iOS .ipa (Release, JS bundle zabalený uvnitř -
# appka běží bez počítače/Metra) pro instalaci přes Sideloadly
# s bezplatným Apple ID. Žádné podepisování tady neprobíhá
# (CODE_SIGNING_ALLOWED=NO) - to dělá až Sideloadly lokálně na
# uživatelově Macu/PC s jeho vlastním free Apple ID.
#
# NETRIVIÁLNÍ ROZHODNUTÍ - proč "Dochzka", ne "Dochazka": `expo
# prebuild` odvozuje název Xcode projektu/schématu z app.json "name"
# ("Docházka") a při sanitizaci na ASCII prostě vypustí diakritiku
# včetně písmene za ní, místo aby ji přepsalo na "a" - výsledek je
# "Dochzka". Ověřeno lokálním prebuildem. Na ZOBRAZOVANÝ název appky
# (CFBundleDisplayName = "Docházka", co uvidíš pod ikonkou) to vliv
# nemá, je to jen vnitřní technické jméno projektu/schématu/workspace.
name: Build unsigned iOS .ipa

#
# RUNNER: pevně macos-26 (arm64), ne macos-latest - "latest" se časem
# přesune na další verzi macOS/Xcode bez varování. Od 28. 10. 2026 GitHub
# hlásí "capacity constraints … macOS arm64 runners" a job se nepřidělí;
# pro ten případ jde ručně (Actions -> Run workflow) zvolit Intel runner
# macos-26-intel - stejný obraz macOS 26, stejné Xcode 26.6.
# Xcode 26.6 je ověřené buildem #12 (RN 0.86 chce Xcode >= 16.1).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner'
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install JS dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios

      - name: Cache CocoaPods
        id: cache-pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.arch }}-${{ hashFiles('ios/Podfile', 'package-lock.json') }}
          restore-keys: pods-${{ runner.arch }}-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (Release, bez podpisu)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Dochzka.xcworkspace \
            -scheme Dochzka \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Zabalit jako nepodepsané .ipa
        working-directory: ios
        run: |
          set -eu
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app')"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q ../Dochazka-unsigned.ipa Payload

      - name: Nahrát .ipa jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dochazka-unsigned-ipa
          path: Dochazka-unsigned.ipa
          retention-days: 14
